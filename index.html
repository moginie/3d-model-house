<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>21 Merino Street — 3D model</title>
  <style>
    html, body { margin: 0; height: 100%; background: #c9d7e4; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    canvas { display: block; }
    #panel {
      position: fixed; top: 16px; left: 16px; width: 280px;
      background: rgba(22, 24, 28, 0.88); color: #f4f1ea;
      border-radius: 12px; padding: 14px 16px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    #panel h1 { font-size: 16px; margin: 0 0 2px; font-weight: 650; }
    #panel p { margin: 0 0 10px; color: #c8c2b6; font-size: 12px; line-height: 1.4; }
    #views, #toggles { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    button {
      background: #3a3f48; color: #fff; border: 0; border-radius: 7px;
      padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    button.active, button:hover { background: #8a6232; }
    #facts { font-size: 12px; line-height: 1.45; color: #e7e1d6; }
    #facts b { color: #fff; font-weight: 600; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>21 Merino Street</h1>
    <p>Harristown, single-storey house. Rooms use the 2025 floor plan. Porch depth is the 2021 measurement, 1.7 m.</p>
    <div id="views">
      <button id="cam-front" class="active">Front</button>
      <button id="cam-rear">Rear</button>
      <button id="cam-top">Top</button>
    </div>
    <div id="toggles">
      <button id="toggle-roof" class="active">Roof on</button>
      <button id="toggle-labels" class="active">Labels on</button>
    </div>
    <div id="facts">
      <b>Internal</b> 154 m² &nbsp; <b>Land</b> 587 m²<br>
      4 bed · 1 bath · carport · alfresco · shed<br>
      Block about 20 m wide × 29 m deep
    </div>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const WALL_H = 2.55;
const WALL_T = 0.12;

const brick = new THREE.MeshStandardMaterial({ color: 0xd9c7a2, roughness: 0.92 });
const brickDark = new THREE.MeshStandardMaterial({ color: 0xc2ae88, roughness: 0.9 });
const tile = new THREE.MeshStandardMaterial({ color: 0x8e9194, roughness: 0.8, side: THREE.DoubleSide });
const metal = new THREE.MeshStandardMaterial({ color: 0xd5d8dc, roughness: 0.45, metalness: 0.25, side: THREE.DoubleSide });
const metalDark = new THREE.MeshStandardMaterial({ color: 0xb7bcc2, roughness: 0.5, metalness: 0.2 });
const timber = new THREE.MeshStandardMaterial({ color: 0xa67b52, roughness: 0.8 });
const tileFloor = new THREE.MeshStandardMaterial({ color: 0x6f736f, roughness: 0.7 });
const deck = new THREE.MeshStandardMaterial({ color: 0xcbb892, roughness: 0.85 });
const concrete = new THREE.MeshStandardMaterial({ color: 0xc5c1b8, roughness: 0.95 });
const grass = new THREE.MeshStandardMaterial({ color: 0x6d8a45, roughness: 1 });
const road = new THREE.MeshStandardMaterial({ color: 0x5c6168, roughness: 0.95 });
const glass = new THREE.MeshStandardMaterial({ color: 0x9fd0e4, roughness: 0.15, transparent: true, opacity: 0.45 });
const frame = new THREE.MeshStandardMaterial({ color: 0xf3f4f5, roughness: 0.6 });
const solar = new THREE.MeshStandardMaterial({ color: 0x1d2630, roughness: 0.4, metalness: 0.3 });
const fenceMat = new THREE.MeshStandardMaterial({ color: 0xf7f7f5, roughness: 0.7 });
const trim = new THREE.MeshStandardMaterial({ color: 0x4e5156, roughness: 0.7 });
for (const m of [brick, brickDark, tile, metal, metalDark, timber, tileFloor, deck, concrete, grass, road, glass, frame, solar, fenceMat, trim]) {
  m.side = THREE.DoubleSide;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5d5e4);
scene.fog = new THREE.Fog(0xc5d5e4, 48, 90);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.target.set(10, 1.2, 14);

scene.add(new THREE.HemisphereLight(0xfff4e0, 0x6a7a48, 0.85));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.35);
sun.position.set(-12, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -25;
sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25;
sun.shadow.camera.bottom = -25;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 60;
scene.add(sun);

const root = new THREE.Group();
scene.add(root);
// Mirror east-west so the street view matches the photos: carport on the left.
const house = new THREE.Group();
house.scale.x = -1;
house.position.x = 20;
root.add(house);
const roofs = new THREE.Group();
house.add(roofs);
const labels = new THREE.Group();
root.add(labels);

function mesh(geo, mat, x, y, z, parent = house) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
function box(w, h, d, x, y, z, mat, parent = root) {
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, parent);
}
function label(text, x, z) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(20,20,20,0.72)";
  roundRect(g, 8, 24, 496, 80, 16); g.fill();
  g.fillStyle = "#fff";
  g.font = "600 36px sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(text, 256, 64);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthTest: false }));
  sprite.position.set(20 - x, 0.35, z);
  sprite.scale.set(2.8, 0.7, 1);
  labels.add(sprite);
}
function roundRect(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// Lot: 20 m east-west (x), 29 m south-north (z). Street is south.
box(20, 0.08, 29, 10, 0, 14.5, grass);
box(24, 0.06, 6, 10, -0.01, -3, road);
box(20, 0.02, 1.6, 10, 0.05, 0.8, concrete); // footpath
// Driveway into the double carport, west side.
box(5.4, 0.03, 8.2, 4.9, 0.09, 4.1, concrete);

// Boundary fence. Street fence is lower and open at the driveway.
function fenceRun(x1, z1, x2, z2, h, gap) {
  const dx = x2 - x1, dz = z2 - z1;
  const len = Math.hypot(dx, dz);
  const ux = dx / len, uz = dz / len;
  for (let d = 0; d <= len; d += 1.8) {
    if (gap && d > gap[0] && d < gap[1]) continue;
    box(0.06, h, 0.06, x1 + ux * d, h / 2, z1 + uz * d, fenceMat);
  }
  const rails = gap ? [[0, gap[0]], [gap[1], len]] : [[0, len]];
  for (const [a, b] of rails) {
    if (b - a < 0.2) continue;
    const mid = (a + b) / 2;
    box(Math.abs(dx) > Math.abs(dz) ? b - a : 0.04, 0.04, Math.abs(dz) >= Math.abs(dx) ? b - a : 0.04, x1 + ux * mid, h * 0.72, z1 + uz * mid, fenceMat);
    box(Math.abs(dx) > Math.abs(dz) ? b - a : 0.04, 0.04, Math.abs(dz) >= Math.abs(dx) ? b - a : 0.04, x1 + ux * mid, h * 0.38, z1 + uz * mid, fenceMat);
  }
}
fenceRun(0, 0, 20, 0, 1.15, [2.2, 7.6]);
fenceRun(0, 0, 0, 29, 1.7);
fenceRun(20, 0, 20, 29, 1.7);
fenceRun(0, 29, 20, 29, 1.7);

// House external footprint. South wall of the enclosed house is z = 8.2.
// x 2.2 .. 17.95 (15.75 m), enclosed depth 7.42 m going north.
const HX = 2.2, HZ = 8.2, HW = 15.75, HD = 7.42;

function wallX(x, z, len, h = WALL_H) { box(WALL_T, h, len, x, h / 2, z, brick); }
function wallZ(x, z, len, h = WALL_H) { box(len, h, WALL_T, x, h / 2, z, brick); }

// Exterior shell with door and window gaps.
// West and east are solid.
wallX(HX, HZ + HD / 2, HD);
wallX(HX + HW, HZ + HD / 2, HD);
// North wall, gap for kitchen opening onto the alfresco.
wallZ(HX + 2.2, HZ + HD, 4.2);
wallZ(HX + 12.4, HZ + HD, 6.5);
// South wall in three pieces: bed 4, beside the front door, bedrooms.
wallZ(HX + 1.55, HZ, 3.1);
wallZ(HX + 6.55, HZ, 1.3);
wallZ(HX + 13.15, HZ, 5.4);

// Front door and a security-screen window beside it.
box(0.9, 2.05, 0.06, HX + 4.55, 1.05, HZ, frame);
box(0.7, 1.85, 0.04, HX + 4.55, 1.0, HZ + 0.02, glass);
box(1.5, 1.35, 0.06, HX + 1.55, 1.35, HZ, frame);
box(1.35, 1.2, 0.04, HX + 1.55, 1.35, HZ + 0.02, glass);
box(1.6, 1.25, 0.06, HX + 10.3, 1.4, HZ, frame);
box(1.45, 1.1, 0.04, HX + 10.3, 1.4, HZ + 0.02, glass);
box(1.6, 1.25, 0.06, HX + 14.5, 1.4, HZ, frame);
box(1.45, 1.1, 0.04, HX + 14.5, 1.4, HZ + 0.02, glass);
// Kitchen window to alfresco.
box(1.8, 1.15, 0.06, HX + 5.7, 1.45, HZ + HD, frame);
box(1.65, 1.0, 0.04, HX + 5.7, 1.45, HZ + HD - 0.02, glass);

// Interior walls. Coordinates are centres.
// Bed 4 east wall, door near the lounge.
wallX(HX + 3.28, HZ + 5.3, 4.0);
wallX(HX + 3.28, HZ + 0.7, 1.2);
// Lounge / kitchen split.
wallZ(HX + 5.9, HZ + 3.85, 5.0);
// East wing west wall (bed 2 / wet), door into the hall.
wallX(HX + 8.5, HZ + 1.45, 2.5);
wallX(HX + 8.5, HZ + 5.7, 3.2);
// Bed 2 / bed 1 split.
wallX(HX + 12.05, HZ + 1.5, 2.7);
// Bed 3 south wall.
wallZ(HX + 14.0, HZ + 3.75, 3.5);
// Wet rooms, three narrow bays above bed 2.
wallZ(HX + 10.25, HZ + 4.35, 3.3);
wallX(HX + 9.6, HZ + 5.85, 2.6);
wallX(HX + 10.9, HZ + 5.85, 2.6);

// Floors. y just above the grass.
function floor(x, z, w, d, mat, name) {
  box(w, 0.05, d, x + w / 2, 0.12, z + d / 2, mat);
  if (name) label(name, x + w / 2, z + d / 2);
}
const ix = HX + WALL_T;
const iz = HZ + WALL_T;
floor(ix, iz, 3.1, 7.2, timber, "Bed 4 / living");
floor(ix + 3.22, iz, 5.0, 3.55, timber, "Lounge");
floor(ix + 3.22, iz + 3.7, 5.0, 3.35, tileFloor, "Kitchen");
floor(ix + 8.4, iz, 3.4, 2.8, timber, "Bed 2");
floor(ix + 11.95, iz, 3.55, 2.8, timber, "Bed 1");
floor(ix + 11.95, iz + 3.75, 3.55, 3.3, timber, "Bed 3");
floor(ix + 8.4, iz + 4.35, 1.15, 2.7, tileFloor, "Laundry");
floor(ix + 9.6, iz + 4.35, 1.15, 2.7, tileFloor, "WC");
floor(ix + 10.8, iz + 4.35, 1.05, 2.7, tileFloor, "Bath");

// Porch, south of the lounge. 5.0 × 1.7 from the 2021 plan.
const porchX = HX + 3.34, porchZ = HZ - 1.7;
floor(porchX, porchZ, 5.0, 1.58, concrete, "Porch");
box(5.15, 0.1, 0.1, porchX + 2.5, 0.2, porchZ, concrete);
// Porch posts and a low roof.
box(0.1, 2.35, 0.1, porchX + 0.15, 1.2, porchZ + 0.1, frame);
box(0.1, 2.35, 0.1, porchX + 4.85, 1.2, porchZ + 0.1, frame);
box(5.3, 0.08, 1.9, porchX + 2.5, 2.4, porchZ + 0.85, metal, roofs);

// Alfresco 7.3 × 4.4 on the north side.
const alfX = HX + 2.05, alfZ = HZ + HD, alfW = 7.3, alfD = 4.4;
floor(alfX, alfZ, alfW, alfD, deck, "Alfresco");
for (const [px, pz] of [[0.15, alfD - 0.15], [alfW / 2, alfD - 0.15], [alfW - 0.15, alfD - 0.15], [alfW - 0.15, 0.15]]) {
  box(0.1, 2.3, 0.1, alfX + px, 1.15, alfZ + pz, frame);
}
// Skillion falling to the north.
{
  const geo = new THREE.BufferGeometry();
  const y0 = 2.45, y1 = 2.15;
  const x0 = alfX - 0.15, x1 = alfX + alfW + 0.15, z0 = alfZ - 0.05, z1 = alfZ + alfD + 0.2;
  geo.setAttribute("position", new THREE.Float32BufferAttribute([
    x0, y0, z0,  x1, y0, z0,  x1, y1, z1,
    x0, y0, z0,  x1, y1, z1,  x0, y1, z1,
  ], 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, metal);
  m.castShadow = true;
  roofs.add(m);
}

// Double carport 5.7 × 5.7, gable facing the street.
const cpX = HX - 0.15, cpZ = HZ - 5.7, cpW = 5.7, cpD = 5.7;
box(cpW, 0.04, cpD, cpX + cpW / 2, 0.1, cpZ + cpD / 2, concrete);
for (const [px, pz] of [[0.15, 0.15], [cpW - 0.15, 0.15], [0.15, cpD - 0.15], [cpW - 0.15, cpD - 0.15]]) {
  box(0.12, 2.25, 0.12, cpX + px, 1.15, cpZ + pz, metalDark);
}
{
  const geo = new THREE.BufferGeometry();
  const yb = 2.3, rise = 1.05;
  const x0 = cpX - 0.2, x1 = cpX + cpW + 0.2, xm = (x0 + x1) / 2;
  const z0 = cpZ - 0.15, z1 = cpZ + cpD + 0.1;
  const v = [
    x0, yb, z0, xm, yb + rise, z0, x1, yb, z0,
    x0, yb, z1, xm, yb + rise, z1, x1, yb, z1,
  ];
  // west slope and east slope, plus gable ends
  geo.setAttribute("position", new THREE.Float32BufferAttribute([
    x0, yb, z0, x0, yb, z1, xm, yb + rise, z1,  x0, yb, z0, xm, yb + rise, z1, xm, yb + rise, z0,
    x1, yb, z0, xm, yb + rise, z0, xm, yb + rise, z1,  x1, yb, z0, xm, yb + rise, z1, x1, yb, z1,
    x0, yb, z0, xm, yb + rise, z0, x1, yb, z0,
    x0, yb, z1, x1, yb, z1, xm, yb + rise, z1,
  ], 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, metal);
  m.castShadow = true;
  roofs.add(m);
}
label("Carport", cpX + cpW / 2, cpZ + cpD / 2);

// Shed 3 × 3, detached, north-east of the alfresco.
const shX = HX + 11.6, shZ = HZ + HD + 4.9, sh = 3;
floor(shX, shZ, sh, sh, concrete, "Shed");
wallX(shX, shZ + sh / 2, sh, 2.2);
wallX(shX + sh, shZ + sh / 2, sh, 2.2);
wallZ(shX + 0.7, shZ, 1.2, 2.2);
wallZ(shX + sh - 0.55, shZ, 0.9, 2.2);
wallZ(shX + sh / 2, shZ + sh, sh, 2.2);
box(0.9, 1.9, 0.05, shX + 1.7, 1.0, shZ, trim);
{
  const geo = new THREE.BufferGeometry();
  const yb = 2.2, rise = 0.7;
  const x0 = shX - 0.12, x1 = shX + sh + 0.12, xm = (x0 + x1) / 2;
  const z0 = shZ - 0.12, z1 = shZ + sh + 0.12;
  geo.setAttribute("position", new THREE.Float32BufferAttribute([
    x0, yb, z0, x0, yb, z1, xm, yb + rise, z1, x0, yb, z0, xm, yb + rise, z1, xm, yb + rise, z0,
    x1, yb, z0, xm, yb + rise, z0, xm, yb + rise, z1, x1, yb, z0, xm, yb + rise, z1, x1, yb, z1,
  ], 3));
  geo.computeVertexNormals();
  roofs.add(new THREE.Mesh(geo, metal));
}

// Hip roof over the enclosed house, grey tile, with a north-facing solar array.
function hipRoof(x, z, w, d, base, rise) {
  const geo = new THREE.BufferGeometry();
  const x0 = x, x1 = x + w, z0 = z, z1 = z + d;
  const inset = Math.min(w, d) / 2;
  const rx0 = x0 + inset, rx1 = x1 - inset;
  const zm = z + d / 2;
  geo.setAttribute("position", new THREE.Float32BufferAttribute([
    // south
    x0, base, z0,  x1, base, z0,  rx1, base + rise, zm,  x0, base, z0,  rx1, base + rise, zm,  rx0, base + rise, zm,
    // north
    x1, base, z1,  x0, base, z1,  rx0, base + rise, zm,  x1, base, z1,  rx0, base + rise, zm,  rx1, base + rise, zm,
    // west
    x0, base, z1,  x0, base, z0,  rx0, base + rise, zm,
    // east
    x1, base, z0,  x1, base, z1,  rx1, base + rise, zm,
  ], 3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, tile);
  m.castShadow = true;
  roofs.add(m);
  // Solar panels on the north slope.
  const panel = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.05, 1.5), solar);
  panel.position.set(x + w * 0.48, base + rise * 0.62, z + d * 0.72);
  panel.rotation.x = -0.42;
  roofs.add(panel);
  const panel2 = panel.clone();
  panel2.position.x += 3.5;
  roofs.add(panel2);
}
hipRoof(HX - 0.35, HZ - 0.35, HW + 0.7, HD + 0.55, WALL_H - 0.05, 1.45);
// Fascia band so the eave reads against the brick.
box(HW + 0.7, 0.16, 0.12, HX + HW / 2, WALL_H - 0.02, HZ - 0.28, trim, roofs);
box(HW + 0.7, 0.16, 0.12, HX + HW / 2, WALL_H - 0.02, HZ + HD + 0.22, trim, roofs);

// A couple of trees from the front and rear photos. Not to a survey.
function tree(x, z, h, r) {
  box(0.28, h * 0.45, 0.28, x, h * 0.22, z, new THREE.MeshStandardMaterial({ color: 0x6b4a32, roughness: 1 }));
  mesh(new THREE.SphereGeometry(r, 16, 12), new THREE.MeshStandardMaterial({ color: 0x3f6b32, roughness: 1 }), x, h * 0.62, z);
}
tree(16.8, 5.2, 7.5, 2.4);
tree(8.5, 24.5, 6.5, 2.1);
tree(1.3, 18, 5, 1.5);

const views = {
  front: { pos: [10, 12, -16], target: [10, 1.2, 14] },
  rear: { pos: [10, 12, 42], target: [10, 1.2, 16] },
  top: { pos: [10, 36, 14.6], target: [10, 0, 14.5] },
};
function setView(name) {
  const v = views[name];
  camera.position.set(...v.pos);
  controls.target.set(...v.target);
  controls.update();
  for (const id of ["cam-front", "cam-rear", "cam-top"]) {
    document.getElementById(id).classList.toggle("active", id === "cam-" + name);
  }
}
document.getElementById("cam-front").onclick = () => setView("front");
document.getElementById("cam-rear").onclick = () => setView("rear");
document.getElementById("cam-top").onclick = () => setView("top");

const roofBtn = document.getElementById("toggle-roof");
roofBtn.onclick = () => {
  roofs.visible = !roofs.visible;
  roofBtn.textContent = roofs.visible ? "Roof on" : "Roof off";
  roofBtn.classList.toggle("active", roofs.visible);
};
const labelBtn = document.getElementById("toggle-labels");
labelBtn.onclick = () => {
  labels.visible = !labels.visible;
  labelBtn.textContent = labels.visible ? "Labels on" : "Labels off";
  labelBtn.classList.toggle("active", labels.visible);
};

setView("front");
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
  </script>
</body>
</html>
