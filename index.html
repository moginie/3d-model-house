<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>21 Merino Street — 3D model</title>
  <style>
    html, body { margin: 0; height: 100%; background: #c9d7e4; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    canvas { display: block; }
    #panel {
      position: fixed; top: 16px; left: 16px; width: 320px;
      background: rgba(22, 24, 28, 0.88); color: #f4f1ea;
      border-radius: 12px; padding: 14px 16px 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    #panel h1 { font-size: 16px; margin: 0 0 2px; font-weight: 650; }
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    #menu-hide { flex: none; padding: 3px 8px; }
    #menu-show { position: fixed; top: 16px; left: 16px; display: none; box-shadow: 0 6px 18px rgba(0,0,0,.25); padding: 8px 12px; }
    body.menu-hidden #panel { display: none; }
    body.menu-hidden #menu-show { display: block; }
    #panel p { margin: 0 0 10px; color: #c8c2b6; font-size: 12px; line-height: 1.4; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    button {
      background: #3a3f48; color: #fff; border: 0; border-radius: 7px;
      padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
    }
    button.active, button:hover { background: #8a6232; }
    #panel { max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; }
    #panel h2 { font-size: 12px; margin: 12px 0 4px; font-weight: 650; text-transform: uppercase; letter-spacing: .06em; color: #e7c89a; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; color: #e7e1d6; }
    td { padding: 2px 0; vertical-align: top; white-space: nowrap; }
    summary { cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary h2::after { content: " ▾"; }
    details:not([open]) summary h2::after { content: " ▸"; }
    summary h2 { display: inline-block; }
    td.n { text-align: right; white-space: nowrap; padding-left: 8px; font-variant-numeric: tabular-nums; }
    tr.sub td { color: #9d978c; font-size: 11px; padding-left: 10px; }
    tr.total td { border-top: 1px solid #555; font-weight: 650; color: #fff; padding-top: 4px; }
    .note { font-size: 11px; color: #9d978c; margin-top: 4px; line-height: 1.4; }
  </style>
</head>
<body>
  <button id="menu-show" title="Show menu (M)">☰ Menu</button>
  <div id="panel">
    <div class="head">
      <h1>21 Merino Street, Harristown</h1>
      <button id="menu-hide" title="Hide menu (M)">Hide</button>
    </div>
    <p>Layout from the 2025 floor plan. Position on the block, roofs and finishes from the satellite view and listing photos.</p>
    <div class="row">
      <button id="cam-front" class="active">Front</button>
      <button id="cam-rear">Rear</button>
      <button id="cam-top">Top</button>
    </div>
    <div class="row">
      <button id="toggle-roof" class="active">Roof on</button>
      <button id="toggle-labels" class="active">Labels on</button>
    </div>
    <div class="row">
      <button id="phase-before" class="active">Before</button>
      <button id="phase-after">After</button>
    </div>
    <div id="reno" hidden>
      <h2>Renovation cost</h2>
      <table id="reno-table"></table>
      <div class="note">Rates are AUD estimates including GST.</div>
    </div>
    <details open>
      <summary><h2>Property</h2></summary>
      <table id="property-table"></table>
    </details>
    <details open>
      <summary><h2>Rooms</h2></summary>
      <table id="room-table"></table>
      <div class="note" id="room-note"></div>
    </details>
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Plan coordinates are pixels on the 2400 px floor plan image (north up).
// Scale is set by Bed 4 (3.1 × 7.2 m) and the lounge (5.0 m).
const S = 93.5;
// Satellite view: carport on the west boundary, house front wall about 7.4 m from the street boundary.
const HOUSE_SOUTH = 21.6;
const LOT_X0 = 255, LOT_Y0 = 1366 - HOUSE_SOUTH * S;
const X = (px) => (px - LOT_X0) / S;
const Z = (py) => (py - LOT_Y0) / S;
const M = (px) => px / S;

const LOT_W = 20, LOT_D = 29;
const FLOOR = 0.15;
const CEIL = 2.4;
const EAVE_Y = FLOOR + CEIL;
const EXT_T = 0.22;
const INT_T = 0.1;

// ---------- Textures (sizes in metres of surface each image covers) ----------
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
function tex(w, h, draw, sizeU, sizeV, color = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / sizeU, 1 / sizeV);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
const brickTex = tex(512, 460, (g, w, h) => {
  g.fillStyle = "#e6dfcf"; g.fillRect(0, 0, w, h);
  const rows = 10, cols = 4, bh = h / rows, bw = w / cols, m = 5;
  for (let r = 0; r < rows; r++) {
    for (let c = -1; c <= cols; c++) {
      const x = c * bw + (r % 2 ? bw / 2 : 0);
      g.fillStyle = `hsl(${38 + rand() * 6}, ${34 + rand() * 14}%, ${66 + rand() * 9}%)`;
      g.fillRect(x + m / 2, r * bh + m / 2, bw - m, bh - m);
    }
  }
}, 0.96, 0.86);
const tileTex = tex(512, 512, (g, w, h) => {
  const rows = 3, cols = 3, th = h / rows, tw = w / cols;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const l = 40 + rand() * 6;
      const grad = g.createLinearGradient(0, r * th, 0, (r + 1) * th);
      grad.addColorStop(0, `hsl(205, 4%, ${l - 14}%)`);
      grad.addColorStop(0.12, `hsl(205, 4%, ${l}%)`);
      grad.addColorStop(1, `hsl(205, 4%, ${l - 4}%)`);
      g.fillStyle = grad;
      g.fillRect(c * tw, r * th, tw, th);
      g.fillStyle = "rgba(255,255,255,0.06)";
      g.fillRect(c * tw + tw * 0.18, r * th, tw * 0.16, th);
      g.fillRect(c * tw + tw * 0.62, r * th, tw * 0.16, th);
      g.fillStyle = "rgba(0,0,0,0.35)";
      g.fillRect(c * tw, r * th, 2, th);
    }
  }
}, 1, 1);
const ribTex = tex(256, 64, (g, w, h) => {
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h);
  const ribs = 5, p = w / ribs;
  for (let i = 0; i < ribs; i++) {
    g.fillStyle = "#c9c9c9"; g.fillRect(i * p, 0, p * 0.08, h);
    g.fillStyle = "#e3e3e3"; g.fillRect(i * p + p * 0.08, 0, p * 0.1, h);
  }
}, 0.95, 0.25, false);
// Corrugated sheet: 10 corrugations at 76 mm pitch, shaded as a sine wave across the sheet.
const corrTex = tex(320, 8, (g, w, h) => {
  for (let x = 0; x < w; x++) {
    const l = Math.round(196 + 52 * Math.sin((x / w) * Math.PI * 20));
    g.fillStyle = `rgb(${l},${l},${l})`;
    g.fillRect(x, 0, 1, h);
  }
}, 0.76, 1, false);
const boardTex = tex(64, 384, (g, w, h) => {
  const n = 6, bh = h / n;
  for (let i = 0; i < n; i++) {
    const grad = g.createLinearGradient(0, i * bh, 0, (i + 1) * bh);
    grad.addColorStop(0, "#ffffff"); grad.addColorStop(0.85, "#ecebe6"); grad.addColorStop(1, "#b9b7b0");
    g.fillStyle = grad; g.fillRect(0, i * bh, w, bh);
  }
}, 1, 1.02, false);
const grilleTex = tex(128, 182, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  g.strokeStyle = "#e9e6dc"; g.lineWidth = 5;
  for (let i = -4; i <= 4; i++) {
    g.beginPath(); g.moveTo(i * w / 2, 0); g.lineTo(i * w / 2 + w, h); g.stroke();
    g.beginPath(); g.moveTo(i * w / 2, h); g.lineTo(i * w / 2 + w, 0); g.stroke();
  }
}, 0.24, 0.34);
// ---------- Materials ----------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, side: THREE.DoubleSide, ...o });
const brick = mat(0xffffff, { map: brickTex, roughness: 0.95 });
const plaster = mat(0xf1eee8);
const tile = mat(0xffffff, { map: tileTex, roughness: 0.8, side: THREE.FrontSide });
const capping = mat(0x5d6266, { roughness: 0.7 });
const sunroomRoof = mat(0xeceae2, { map: ribTex, roughness: 0.45, metalness: 0.2, side: THREE.FrontSide });
const carportRoof = mat(0x3f7a68, { map: ribTex, roughness: 0.5, metalness: 0.2, side: THREE.FrontSide });
const backer = mat(0xe6e0cf, { map: ribTex, roughness: 0.6, side: THREE.BackSide });
const shedSheet = mat(0xeeece4, { map: ribTex, roughness: 0.5, metalness: 0.15 });
const weatherboard = mat(0xf3f1ea, { map: boardTex });
const steelCream = mat(0xe9e5d8, { roughness: 0.5, metalness: 0.2 });
const timber = mat(0x8a5f3c);
const sunroomTile = mat(0x9b5340, { roughness: 0.7 });
const wetTile = mat(0x55595a, { roughness: 0.6 });
const concrete = mat(0xc7c3ba, { roughness: 0.95 });
const grass = mat(0x6f8c47, { roughness: 1 });
const verge = mat(0x7d9450, { roughness: 1 });
const road = mat(0x50555b, { roughness: 0.95 });
const glass = mat(0x8fb7c9, { roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.35 });
const frosted = mat(0xeef3f5, { roughness: 0.3, transparent: true, opacity: 0.85 });
const frame = mat(0xf2f1ec, { roughness: 0.45, metalness: 0.2 });
const grille = mat(0xffffff, { map: grilleTex, transparent: true, alphaTest: 0.4, roughness: 0.6 });
const sill = mat(0xcdb68c, { roughness: 0.95 });
const charcoal = mat(0x3d4044, { roughness: 0.6, metalness: 0.2 });
const soffit = mat(0xf0eee6, { side: THREE.BackSide });
const aluminium = mat(0xc9cdd2, { roughness: 0.35, metalness: 0.6 });
const fenceGrey = mat(0x7a7f84, { map: ribTex, roughness: 0.55, metalness: 0.25 });
const fenceWhite = mat(0xf7f7f4, { roughness: 0.5 });
const joinery = mat(0xfafafa, { roughness: 0.4 });
const doorTimber = mat(0x6a4a33, { roughness: 0.7 });

// ---------- Scene ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc5d5e4);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 300);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;

scene.add(new THREE.HemisphereLight(0xfff6e6, 0x6f7d55, 0.95));
const sun = new THREE.DirectionalLight(0xfff1d6, 1.5);
sun.position.set(-6, 30, 28);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -24, right: 24, top: 24, bottom: -24, near: 1, far: 90 });
sun.target.position.set(10, 0, 18);
scene.add(sun, sun.target);

const world = new THREE.Group();
const roofs = new THREE.Group();
const labels = new THREE.Group();
scene.add(world, roofs, labels);

// Existing house ("Before") and renovation ("After") layers. Each sits inside the shared group, so the Roof and
// Labels toggles still apply. Helpers add to whichever layer is current.
const phaseLayer = () => ({ world: new THREE.Group(), roofs: new THREE.Group(), labels: new THREE.Group() });
const shared = { world, roofs, labels };
const before = phaseLayer(), after = phaseLayer();
for (const p of [before, after]) { world.add(p.world); roofs.add(p.roofs); labels.add(p.labels); }
const layer = { ...before };
const useLayer = (l) => Object.assign(layer, l);
const renoItems = []; // { item, qty, unit, rate } in AUD incl. GST

// Box UVs in world metres so tiled textures keep a constant scale.
function worldUV(geo, w, h, d, x, y, z) {
  const uv = geo.attributes.uv;
  const faces = [
    (u, v) => [-(z + d / 2) + u * d, y - h / 2 + v * h],
    (u, v) => [z - d / 2 + u * d, y - h / 2 + v * h],
    (u, v) => [x - w / 2 + u * w, z - d / 2 + v * d],
    (u, v) => [x - w / 2 + u * w, z - d / 2 + v * d],
    (u, v) => [x - w / 2 + u * w, y - h / 2 + v * h],
    (u, v) => [-(x + w / 2) + u * w, y - h / 2 + v * h],
  ];
  for (let f = 0; f < 6; f++) {
    for (let i = 0; i < 4; i++) {
      const j = f * 4 + i;
      uv.setXY(j, ...faces[f](uv.getX(j), uv.getY(j)));
    }
  }
}
function box(w, h, d, x, y, z, material, parent = layer.world, worldUv = true) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (worldUv) worldUV(g, w, h, d, x, y, z);
  const m = new THREE.Mesh(g, material);
  m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
// Triangles are wound to face up; uvFn maps a vertex to texture metres.
function surface(points, material, uvFn, parent = layer.roofs) {
  const pos = [], uv = [];
  const v = (p) => new THREE.Vector3(...p);
  for (let i = 0; i < points.length; i += 3) {
    let [a, b, c] = [points[i], points[i + 1], points[i + 2]];
    const n = v(b).sub(v(a)).cross(v(c).sub(v(a)));
    if (n.y < 0) [b, c] = [c, b];
    for (const p of [a, b, c]) {
      pos.push(...p);
      uv.push(...(uvFn ? uvFn(...p) : [0, 0]));
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, material);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  return m;
}
function sheet(points, top, uvFn, parent = layer.roofs) {
  const m = surface(points, top, uvFn, parent);
  const under = new THREE.Mesh(m.geometry, backer);
  under.receiveShadow = true;
  parent.add(under);
  return m;
}
const quad = (a, b, c, d) => [a, b, c, a, c, d];
function rod(a, b, r, material, parent = layer.roofs, segments = 10) {
  const A = new THREE.Vector3(...a), B = new THREE.Vector3(...b);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, A.distanceTo(B), segments), material);
  m.position.copy(A).add(B).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.clone().sub(A).normalize());
  m.castShadow = true;
  parent.add(m);
  return m;
}

// ---------- Walls, windows and doors ----------
// axis "h": runs east-west along plan y = k, from x = a to b.
// axis "v": runs north-south along plan x = k, from y = a to b.
// out: +1 / -1 is the outside direction (+Z south or +X east); 0 for internal walls.
const OPENING = {
  door: { sill: 0, head: 2.04 },
  front: { sill: 0, head: 2.04 },
  entry: { sill: 0, head: 2.1 },
  back: { sill: 0, head: 2.04 },
  open: { sill: 0, head: 2.1 },
  slider: { sill: 0, head: 2.1, panes: 2 },
  window: { sill: 0.9, head: 2.1, panes: 2 },
  kitchen: { sill: 1.05, head: 2.1, panes: 2 },
  high: { sill: 1.45, head: 2.1, panes: 1, frosted: true },
  tall: { sill: 0.45, head: 2.1, panes: 2 },
};
function wall(axis, k, a, b, { t = INT_T, h = CEIL, open = [], out = 0, material = plaster, grilles = true } = {}) {
  const isBrick = t >= EXT_T && material === plaster;
  const faces = (outer) => axis === "h"
    ? [outer, outer, outer, outer, out > 0 ? outer : plaster, out < 0 ? outer : plaster]
    : [out > 0 ? outer : plaster, out < 0 ? outer : plaster, outer, outer, outer, outer];
  const wallMat = isBrick ? faces(brick) : material;
  const put = (len, hh, d, mid, y, off, m, parent = layer.world) => {
    const [cx, cz] = axis === "h" ? [X(mid), Z(k) + off] : [X(k) + off, Z(mid)];
    return axis === "h" ? box(M(len), hh, d, cx, y, cz, m, parent) : box(d, hh, M(len), cx, y, cz, m, parent);
  };
  const piece = (s, e, y0, y1) => {
    if (e - s < 1 || y1 - y0 < 0.01) return;
    put(e - s, y1 - y0, t, (s + e) / 2, FLOOR + y0 + (y1 - y0) / 2, 0, wallMat);
  };
  let cur = a;
  for (const [s, e, kind] of [...open].sort((p, q) => p[0] - q[0])) {
    const o = OPENING[kind];
    piece(cur, s, 0, h);
    piece(s, e, 0, o.sill);
    piece(s, e, o.head, h);
    const mid = (s + e) / 2, len = e - s, hh = o.head - o.sill, cy = FLOOR + o.sill + hh / 2;
    const face = out * (t / 2);
    if (kind === "front") {
      put(len - 6, 2.0, 0.045, mid, FLOOR + 1.0, 0, doorTimber);
      put(len, 2.04, 0.03, mid, FLOOR + 1.02, face + out * 0.03, frame);
      const g = put(len - 10, 1.9, 0.01, mid, FLOOR + 1.02, face + out * 0.05, grille);
      g.castShadow = false;
    } else if (kind === "entry") {
      put(len - 4, 2.06, 0.05, mid, FLOOR + 1.03, 0, doorTimber);
      put(4, 2.1, 0.08, s + 2, FLOOR + 1.05, 0, charcoal);
      put(4, 2.1, 0.08, e - 2, FLOOR + 1.05, 0, charcoal);
    } else if (kind === "back") {
      put(len - 6, 2.0, 0.045, mid, FLOOR + 1.0, 0, joinery);
    } else if (o.panes) {
      const fw = 0.05, fd = 0.07;
      put(len, fw, fd, mid, FLOOR + o.head - fw / 2, 0, frame);
      put(len, fw, fd, mid, FLOOR + o.sill + fw / 2, 0, frame);
      put(fw * S, hh, fd, s + fw * S / 2, cy, 0, frame);
      put(fw * S, hh, fd, e - fw * S / 2, cy, 0, frame);
      for (let i = 1; i < o.panes; i++) put(0.04 * S, hh, fd, s + (len * i) / o.panes, cy, 0, frame);
      put(len - 2 * fw * S, hh - 2 * fw, 0.012, mid, cy, 0, o.frosted ? frosted : glass);
      if (isBrick && grilles) {
        const g = put(len, hh, 0.008, mid, cy, face + out * 0.03, grille);
        g.castShadow = false;
      }
      if (isBrick && o.sill > 0) put(len + 12, 0.09, 0.14, mid, FLOOR + o.sill - 0.05, face + out * 0.04, sill);
      if (isBrick) put(len + 16, 0.06, 0.02, mid, FLOOR + o.head + 0.04, face + out * 0.006, charcoal);
    }
    cur = e;
  }
  piece(cur, b, 0, h);
}

// House shell: x 446–1912, y 672–1366 (15.7 × 7.4 m).
wall("h", 676, 446, 1913, {
  t: EXT_T, out: -1,
  open: [
    [867, 1153, "kitchen"],
    [1257, 1319, "back"],
    [1415, 1470, "high"],
    [1500, 1590, "high"],
    [1737, 1820, "window"],
  ],
});
wall("v", 450, 672, 1366, { t: EXT_T, out: -1, open: [[954, 1038, "window"]] });
wall("v", 1907, 672, 1366, { t: EXT_T, out: 1, open: [[796, 880, "window"], [1186, 1271, "window"]] });
// South: Bed 4 and the bedroom wing sit on y 1361; the lounge is set back to y 1282 behind the porch.
wall("h", 1361, 446, 757, { t: EXT_T, out: 1, open: [[474, 717, "window"]] });
wall("h", 1282, 748, 1232, { t: EXT_T, out: 1, open: [[844, 1013, "window"], [1132, 1212, "front"]] });
wall("h", 1361, 1223, 1913, { t: EXT_T, out: 1, open: [[1292, 1404, "window"], [1664, 1776, "window"]] });

// Interior walls.
wall("v", 752, 672, 1366, { open: [[865, 926, "door"]] });            // Bed 4 | kitchen & lounge
wall("h", 907, 446, 529);                                              // Bed 4 robe, south
wall("v", 668, 672, 737);                                              // Bed 4 robe, east return
wall("v", 1227, 672, 1366, { open: [[814, 886, "door"], [952, 1022, "door"]] }); // kitchen & lounge | laundry, hall & bed 2
wall("v", 1014, 870, 949);                                             // fridge recess
wall("v", 1100, 870, 949);                                             // pantry
wall("h", 870, 1100, 1227);                                            // pantry top
wall("h", 941, 1009, 1227);                                            // fridge + pantry, south
wall("h", 941, 1227, 1661, { open: [[1232, 1307, "door"], [1405, 1480, "door"], [1495, 1565, "door"]] });
wall("v", 1399, 672, 945);                                             // laundry | WC
wall("v", 1484, 672, 945);                                             // WC | bath
wall("v", 1655, 672, 1037, { open: [[956, 1017, "door"]] });          // Bed 3, west
wall("h", 1032, 1223, 1913, { open: [[1469, 1530, "door"], [1566, 1628, "door"]] });

// ---------- Floors and labels ----------
function label(name, dims, x, z, y = FLOOR + 2.2) {
  const c = document.createElement("canvas");
  c.width = 512; c.height = dims ? 168 : 112;
  const g = c.getContext("2d");
  g.fillStyle = "rgba(18,18,20,0.78)";
  g.beginPath(); g.roundRect(6, 6, 500, c.height - 12, 18); g.fill();
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "600 44px sans-serif";
  g.fillText(name, 256, dims ? 58 : 56);
  if (dims) { g.fillStyle = "#e7c89a"; g.font = "500 38px sans-serif"; g.fillText(dims, 256, 116); }
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
  sp.position.set(x, y, z);
  sp.scale.set(1.9, 1.9 * c.height / 512, 1);
  layer.labels.add(sp);
}
function room(name, dims, x0, y0, x1, y1, material, labelY) {
  box(M(x1 - x0), 0.04, M(y1 - y0), X((x0 + x1) / 2), FLOOR + 0.02, Z((y0 + y1) / 2), material);
  if (name) label(name, dims, X((x0 + x1) / 2), Z((y0 + y1) / 2), labelY);
}

// ---------- Main hip roof: charcoal concrete tiles, 22.5° ----------
// wx0..wx1, wz0..wz1 are the outer faces of the walls in metres.
const PITCH = THREE.MathUtils.degToRad(22.5);
function hipRoof(wx0, wx1, wz0, wz1) {
  const eave = 0.45, pitch = PITCH;
  const x0 = wx0 - eave, x1 = wx1 + eave, z0 = wz0 - eave, z1 = wz1 + eave;
  const yb = EAVE_Y, half = (z1 - z0) / 2, rise = Math.tan(pitch) * half, slopeLen = half / Math.cos(pitch);
  const zm = z0 + half, rx0 = x0 + half, rx1 = x1 - half, yr = yb + rise;
  const up = (d) => d / Math.cos(pitch);
  surface(quad([x0, yb, z1], [x1, yb, z1], [rx1, yr, zm], [rx0, yr, zm]), tile, (x, y, z) => [x, up(z1 - z)]);
  surface(quad([x1, yb, z0], [x0, yb, z0], [rx0, yr, zm], [rx1, yr, zm]), tile, (x, y, z) => [-x, up(z - z0)]);
  surface([[x0, yb, z0], [x0, yb, z1], [rx0, yr, zm]], tile, (x, y, z) => [-z, up(x - x0)]);
  surface([[x1, yb, z1], [x1, yb, z0], [rx1, yr, zm]], tile, (x, y, z) => [z, up(x1 - x)]);

  // Ridge and hip capping.
  rod([rx0, yr + 0.04, zm], [rx1, yr + 0.04, zm], 0.11, capping);
  for (const [cx, cz, rx] of [[x0, z0, rx0], [x0, z1, rx0], [x1, z0, rx1], [x1, z1, rx1]]) {
    rod([cx, yb + 0.04, cz], [rx, yr + 0.04, zm], 0.1, capping);
  }

  // Soffit, fascia, quad gutters and downpipes.
  surface(quad([x0, yb, z0], [x1, yb, z0], [x1, yb, z1], [x0, yb, z1]), soffit);
  const gy = yb - 0.06;
  for (const z of [z0, z1]) {
    box(x1 - x0 + 0.24, 0.13, 0.12, (x0 + x1) / 2, gy, z + (z === z0 ? -0.06 : 0.06), charcoal, layer.roofs);
  }
  for (const x of [x0, x1]) {
    box(0.12, 0.13, z1 - z0, x + (x === x0 ? -0.06 : 0.06), gy, zm, charcoal, layer.roofs);
  }
  const downpipe = (wx, wz, gx, gz) => {
    box(0.1, yb - 0.4, 0.05, wx, (yb - 0.4) / 2, wz, charcoal, layer.world);
    rod([wx, yb - 0.4, wz], [gx, gy, gz], 0.04, charcoal, layer.roofs, 6);
  };
  downpipe(wx0 - 0.15, wz1 - 0.25, wx0 - 0.4, z1 + 0.05);
  downpipe(wx1 + 0.15, wz1 - 0.25, wx1 + 0.4, z1 + 0.05);
  downpipe(wx1 + 0.15, wz0 + 0.25, wx1 + 0.4, z0 - 0.05);
  downpipe(wx0 - 0.15, wz0 + 0.25, wx0 - 0.4, z0 - 0.05);

  // Vent pipe and whirlybird.
  {
    const d = 2.4, y = yb + d * Math.tan(pitch);
    rod([x0 + 13.5, y - 0.05, z0 + d], [x0 + 13.5, y + 0.45, z0 + d], 0.05, aluminium);
  }
  {
    const s = slopeLen - 0.9, d = s * Math.cos(pitch);
    const wx = x0 + 3.0, wy = yb + d * Math.tan(pitch), wz = z1 - d;
    rod([wx, wy, wz], [wx, wy + 0.28, wz], 0.13, aluminium, layer.roofs, 16);
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), aluminium);
    dome.position.set(wx, wy + 0.28, wz);
    layer.roofs.add(dome);
  }
}

const wireMatrices = [];
function meshFence(x0, z0, x1, z1, { h = 1.2, gate = null } = {}) {
  const len = Math.hypot(x1 - x0, z1 - z0), ux = (x1 - x0) / len, uz = (z1 - z0) / len;
  const at = (d) => [x0 + ux * d, z0 + uz * d];
  const posts = new Set([0, len]);
  const n = Math.ceil(len / 2.4);
  for (let i = 1; i < n; i++) posts.add((len * i) / n);
  if (gate) { posts.add(gate[0]); posts.add(gate[1]); }
  for (const d of posts) {
    const [x, z] = at(d);
    box(0.05, h + 0.05, 0.05, x, (h + 0.05) / 2, z, fenceWhite);
  }
  for (let y = 0.08; y <= h; y += 0.2) {
    const [cx, cz] = at(len / 2);
    box(ux ? len : 0.012, 0.012, ux ? 0.012 : len, cx, y, cz, fenceWhite);
  }
  const m4 = new THREE.Matrix4();
  for (let d = 0.05; d < len; d += 0.05) {
    const [x, z] = at(d);
    wireMatrices.push(m4.clone().makeTranslation(x, h / 2 + 0.02, z));
  }
  if (gate) {
    const [a, b] = gate.map(at);
    const [mx, mz] = at((gate[0] + gate[1]) / 2);
    const gl = gate[1] - gate[0];
    for (const y of [0.1, h - 0.02]) box(ux ? gl : 0.035, 0.035, ux ? 0.035 : gl, mx, y, mz, fenceWhite);
    for (const [x, z] of [a, b]) box(0.035, h, 0.035, x + ux * 0.04, h / 2, z + uz * 0.04, fenceWhite);
  }
}

  // Floors and labels.
  const floorMat = { bed: timber, live: timber, wet: wetTile };
  for (const [name, x0, z0, x1, z1, kind] of proposedRooms) {
    const small = name === "WIR" || name === "Linen" || name === "Hall";
    const dims = name === "WC" ? null : `${(x1 - x0).toFixed(1)} × ${(z1 - z0).toFixed(1)} m`;
    room(small ? null : name, dims, PX(x0), PY(z0), PX(x1), PY(z1), floorMat[kind]);
  }

  // Kitchen run with tall fridge/pantry unit, island, robes, laundry bench, bath.
  box(0.6, 2.2, 0.9, 10.04, FLOOR + 1.1, 14.88, joinery);
  box(0.6, 0.9, 1.77, 10.04, FLOOR + 0.45, 16.22, joinery);
  box(0.62, 0.04, 1.77, 10.03, FLOOR + 0.92, 16.22, stone);
  box(0.9, 0.9, 2.2, 8.45, FLOOR + 0.45, 16.1, joinery);
  box(1.0, 0.04, 2.3, 8.45, FLOOR + 0.92, 16.1, stone);
  for (const [x, z, w] of [[13.2, 18.68, 2.0], [17.1, 18.68, 2.0], [2.7, 17.53, 1.8], [2.7, 18.23, 1.8]]) {
    box(w, 2.2, 0.6, x, FLOOR + 1.1, z, joinery);
  }
  box(0.5, 2.0, 1.6, 2.04, FLOOR + 1.0, 13.3, joinery);
  box(2.4, 0.9, 0.6, 16.99, FLOOR + 0.45, 14.73, joinery);
  box(1.7, 0.55, 0.75, 11.29, FLOOR + 0.28, 14.81, frame);

  // One straight gable roof: corrugated, 15° pitch, ridge running the full width east–west, gable ends both sides.
  // The rear slope covers the deck, then steps back to a higher eave along the house wall east of the deck,
  // leaving the corner behind the laundry open.
  {
    const pitch = THREE.MathUtils.degToRad(15), tp = Math.tan(pitch), eave = 0.45, rake = 0.3, DE = 12.54;
    const ezN = SN - eave, ezS = S0 + eave, ezM = N0 - eave, zr = (ezN + ezS) / 2;
    const roofY = (z) => EAVE_Y + tp * Math.min(z - ezN, ezS - z);
    const yr = roofY(zr), yM = roofY(ezM);
    const rx0 = W0 - rake, rx1 = W1 + rake, xD = DE + rake, xb = DE - 0.06;
    const up = (z) => Math.abs(z - zr) / Math.cos(pitch);
    sheet([
      ...quad([rx0, EAVE_Y, ezN], [xD, EAVE_Y, ezN], [xD, yM, ezM], [rx0, yM, ezM]),
      ...quad([rx0, yM, ezM], [rx1, yM, ezM], [rx1, yr, zr], [rx0, yr, zr]),
      ...quad([rx0, yr, zr], [rx1, yr, zr], [rx1, EAVE_Y, ezS], [rx0, EAVE_Y, ezS]),
    ], roofSheet, (x, y, z) => [x, up(z)]);
    surface(quad([rx0, EAVE_Y, ezN], [xb, EAVE_Y, ezN], [xb, EAVE_Y, ezS], [rx0, EAVE_Y, ezS]), soffit);
    surface(quad([xb, EAVE_Y, N0], [rx1, EAVE_Y, N0], [rx1, EAVE_Y, ezS], [xb, EAVE_Y, ezS]), soffit);
    surface(quad([xb, yM, ezM], [rx1, yM, ezM], [rx1, yM, N0], [xb, yM, N0]), soffit);
    rod([rx0, yr + 0.03, zr], [rx1, yr + 0.03, zr], 0.07, capping);
    for (const [x, z, y] of [[rx0, ezN, EAVE_Y], [rx0, ezS, EAVE_Y], [rx1, ezM, yM], [rx1, ezS, EAVE_Y]]) {
      rod([x, y - 0.02, z], [x, yr + 0.01, zr], 0.05, charcoal);
    }
    rod([xD, EAVE_Y - 0.02, ezN], [xD, yM - 0.02, ezM], 0.05, charcoal);

    const fan = (pts) => {
      const tris = [];
      for (let i = 1; i < pts.length - 1; i++) tris.push(pts[0], pts[i], pts[i + 1]);
      return tris;
    };
    const boards = (px, py, pz) => [pz + px, py];
    // Gable ends: white weatherboard from the wall plate to the roof, with a louvred vent near the apex.
    for (const [x, out, z0] of [[W0 - 0.005, -1, SN], [W1 + 0.005, 1, N0]]) {
      const pts = [[z0, EAVE_Y], [S0, EAVE_Y], [S0, roofY(S0)], [zr, yr], [z0, roofY(z0)]].map(([z, y]) => [x, y, z]);
      surface(fan(pts), weatherboard, boards, layer.world);
      box(0.06, 0.5, 0.9, x + out * 0.03, yr - 0.6, zr, charcoal);
      for (let i = 0; i < 4; i++) box(0.07, 0.03, 0.82, x + out * 0.05, yr - 0.79 + i * 0.12, zr, frame);
    }
    // Weatherboard where the roof steps: over the deck's east beam and above the wall behind the laundry.
    surface(fan([[ezN, EAVE_Y], [N0, EAVE_Y], [N0, yM], [ezM, yM]].map(([z, y]) => [xb, y, z])), weatherboard, boards, layer.world);
    surface(quad([xb, EAVE_Y, N0 - 0.005], [W1, EAVE_Y, N0 - 0.005], [W1, yM, N0 - 0.005], [xb, yM, N0 - 0.005]), weatherboard, boards, layer.world);

    // Gutters on every eave and downpipes.
    const gy = EAVE_Y - 0.06, gM = yM - 0.06;
    box(rx1 - rx0 + 0.1, 0.13, 0.12, (rx0 + rx1) / 2, gy, ezS + 0.06, charcoal, layer.roofs);
    box(xD - rx0 + 0.05, 0.13, 0.12, (rx0 + xD) / 2, gy, ezN - 0.06, charcoal, layer.roofs);
    box(rx1 - xD + 0.05, 0.13, 0.12, (xD + rx1) / 2, gM, ezM - 0.06, charcoal, layer.roofs);
    for (const [x, wz, gz, g] of [
      [W0 + 0.3, S0 + 0.04, ezS + 0.06, gy], [W1 - 0.3, S0 + 0.04, ezS + 0.06, gy],
      [W0 + 0.3, SN - 0.04, ezN - 0.06, gy], [W1 - 0.3, N0 - 0.04, ezM - 0.06, gM], [xb, 10.18, ezN - 0.06, gy],
    ]) {
      box(0.1, g - 0.35, 0.05, x, (g - 0.35) / 2, wz, charcoal, layer.world);
      rod([x, g - 0.35, wz], [x, g, gz], 0.04, charcoal, layer.roofs, 6);
    }

    // Opening skylights over the kitchen and hall.
    const skyMat = mat(0x9cc4d8, { roughness: 0.1, metalness: 0.3 });
    for (const [x, z] of [[8.45, 16.8], [12.3, 17.4]]) {
      const s = box(0.7, 0.08, 0.95, x, roofY(z) + 0.06, z, skyMat, layer.roofs, false);
      s.rotation.x = z < zr ? -pitch : pitch;
    }

    // Deck under the main roof: timber boards on the old sunroom slab area, lined ceiling, steel posts and beams.
    box(DE - SE, FLOOR, N0 - 10.18, (SE + DE) / 2, FLOOR / 2, (10.18 + N0) / 2, deckBoards);
    box(1.8, 0.08, 0.35, 10.0, 0.04, 10.0, deckBoards);
    const zb = 10.3, yb = EAVE_Y - 0.11;
    box(xb - SE, 0.2, 0.1, (SE + xb) / 2, yb, zb, charcoal);
    box(0.1, 0.2, N0 - zb, xb, yb, (zb + N0) / 2, charcoal);
    for (const [x, z] of [[xb, zb], [10.0, zb], [xb, 13.95]]) box(0.09, yb - 0.1, 0.09, x, (yb - 0.1) / 2, z, charcoal);
    label("Covered deck", "5.0 × 4.0 m", 10.04, 12.18, FLOOR + 1.5);
  }

  // Open carport 5.8 × 6.0 m: freestanding skillion, clear of the house gutter.
  {
    const x0 = 0.1, x1 = 6.1, z0 = 22.35, z1 = 27.9, yHi = 2.85, yLo = 2.62;
    box(5.8, 0.05, 6.0, 3.1, 0.025, 24.6, concrete);
    box(5.8, 0.05, 33.2 - 27.6, 3.1, 0.0, (27.6 + 33.2) / 2, concrete);
    sheet(quad([x0, yHi, z0], [x1, yHi, z0], [x1, yLo, z1], [x0, yLo, z1]), roofSheet, (x, y, z) => [x, z]);
    box(x1 - x0, 0.16, 0.06, (x0 + x1) / 2, yLo - 0.06, z1, charcoal, layer.roofs);
    box(x1 - x0, 0.16, 0.06, (x0 + x1) / 2, yHi - 0.06, z0, charcoal, layer.roofs);
    for (const x of [x0, x1]) box(0.06, 0.16, z1 - z0, x, (yHi + yLo) / 2 - 0.06, (z0 + z1) / 2, charcoal, layer.roofs);
    for (const x of [0.3, 5.9]) {
      for (const z of [22.6, 25.2, 27.7]) box(0.1, 2.5, 0.1, x, 1.25, z, charcoal);
      box(0.1, 0.22, 5.3, x, 2.5, 25.15, charcoal);
    }
    label("Carport (open)", "5.8 × 6.0 m", 3.1, 24.6, 1.8);
  }

  // Front path and the walk from the carport; the front door sits under the main eave.
  {
    box(1.2, 0.05, 29.75 - S0, 9.75, 0.03, (S0 + 29.75) / 2, concrete);
    box(3.15, 0.05, 1.2, 7.58, 0.03, 22.2, concrete);
  }

  // Front fence: slim black aluminium vertical battens on a low rendered plinth, no piers.
  // A rendered letterbox wall sits beside the pedestrian gate; a low hedge lines the inside.
  {
    const black = mat(0x1e2023, { roughness: 0.45, metalness: 0.3 });
    const hedge = mat(0x3f5f32, { roughness: 1 });
    const battens = [];
    const m4 = new THREE.Matrix4();
    // skip: [from, to] distances along the run left open (letterbox wall); gate: [from, to] gets a frame.
    const battenFence = (x0, z0, x1, z1, { skip = [], gate = null } = {}) => {
      const len = Math.hypot(x1 - x0, z1 - z0), ux = (x1 - x0) / len, uz = (z1 - z0) / len;
      const at = (d) => [x0 + ux * d, z0 + uz * d];
      const run = (a, b, h, y, d, m) => {
        const [cx, cz] = at((a + b) / 2), l = b - a;
        box(ux ? l : d, h, ux ? d : l, cx, y, cz, m);
      };
      const open = (d) => skip.some(([a, b]) => d > a && d < b);
      const cuts = [0, ...skip.flat(), len].sort((a, b) => a - b);
      for (let i = 0; i < cuts.length - 1; i++) {
        if (!open((cuts[i] + cuts[i + 1]) / 2)) run(cuts[i], cuts[i + 1], 0.3, 0.15, 0.18, render);
      }
      for (let d = 0.05; d < len - 0.02; d += 0.085) {
        if (open(d)) continue;
        const [x, z] = at(d);
        battens.push(m4.clone().makeRotationY(ux ? 0 : Math.PI / 2).setPosition(x, 0.925, z));
      }
      for (let d = 0; d <= len + 0.01; d += len / Math.max(1, Math.round(len / 2.4))) {
        if (open(d)) continue;
        const [x, z] = at(d);
        box(0.05, 1.2, 0.05, x - uz * 0.04, 0.9, z + ux * 0.04, black);
      }
      if (gate) {
        for (const d of gate) run(d - 0.025, d + 0.025, 1.2, 0.9, 0.06, black);
        run(gate[0], gate[1], 0.04, 1.48, 0.05, black);
      }
    };
    battenFence(6.2, LOT_D, LOT_W, LOT_D, { skip: [[1.55, 2.95]], gate: [3.05, 4.05] });
    battenFence(LOT_W, S0, LOT_W, LOT_D);
    battenFence(6.2, 27.6, 6.2, LOT_D);
    battenFence(W1 + 0.1, S0, LOT_W, S0, { gate: [0.1, 1.3] });
    battenFence(0, S0, W0 - 0.1, S0, { gate: [0.1, 1.3] });
    const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(0.065, 1.15, 0.016), black, battens.length);
    battens.forEach((m, i) => inst.setMatrixAt(i, m));
    inst.castShadow = inst.receiveShadow = true;
    layer.world.add(inst);

    // Letterbox wall with a timber-look number panel and black slot.
    box(1.4, 1.6, 0.3, 8.45, 0.8, LOT_D, render);
    box(0.5, 0.36, 0.02, 8.15, 1.15, LOT_D + 0.16, doorTimber);
    box(0.34, 0.05, 0.03, 8.85, 1.2, LOT_D + 0.16, black);
    // Low hedge inside the fence, either side of the path.
    for (const [a, b] of [[6.4, 7.6], [10.5, 19.8]]) box(b - a, 0.6, 0.5, (a + b) / 2, 0.3, LOT_D - 0.45, hedge);
    box(0.5, 0.6, LOT_D - S0 - 1.2, LOT_W - 0.45, 0.3, (S0 + 0.3 + LOT_D - 0.9) / 2, hedge);
  }

  // Service side (east): hot water heat pump, AC units, bins, fold-down clothesline and a concrete path to the shed.
  rod([18.85, 0, 15.0], [18.85, 1.6, 15.0], 0.28, frame, layer.world, 16);
  for (const z of [16.1, 16.95]) box(0.3, 0.6, 0.8, 18.62, 0.35, z, frame);
  for (const [z, lid] of [[19.1, 0xc33b2f], [19.85, 0xe2c23a]]) {
    box(0.55, 0.95, 0.65, 19.4, 0.48, z, mat(0x2f5a3a));
    box(0.58, 0.05, 0.68, 19.4, 0.98, z, mat(lid));
  }
  box(0.6, 0.04, 2.4, 19.68, 1.7, 12.0, aluminium);
  for (const z of [10.85, 13.15]) box(0.04, 0.5, 0.04, 19.95, 1.5, z, aluminium);
  box(1.45, 0.04, 18.4, 19.22, 0.02, 12.4, concrete);

  // Shed moved to the rear north-east corner.
  shed(142.8, -826.9);
}
useLayer(before);


// ---------- Room and property schedule ----------
const fmt = (n, d = 1) => n.toFixed(d);
const money = (n) => "$" + Math.round(n).toLocaleString("en-AU");
const rows = (el, list) => { document.getElementById(el).innerHTML = list.join(""); };
const tr = (a, b, cls = "") => `<tr class="${cls}"><td>${a}</td><td class="n">${b}</td></tr>`;

// Plan rectangles x0, y0, x1, y1 (internal faces of walls).
const roomRects = [
  ["Bed 4 / Living", 455, 681, 748, 1356, "incl. robe"],
  ["Kitchen", 757, 681, 1223, 946, "incl. fridge recess & pantry"],
  ["Lounge", 757, 946, 1223, 1278],
  ["Bed 1", 1556, 1036, 1903, 1356, "incl. robe"],
  ["Bed 2", 1231, 1036, 1548, 1356, "incl. robe"],
  ["Bed 3", 1660, 681, 1903, 1028, "incl. robe"],
  ["Bath", 1489, 681, 1651, 937],
  ["WC", 1404, 681, 1480, 937],
  ["Laundry", 1231, 681, 1395, 937],
  ["Hall", 1231, 945, 1651, 1028],
  ["Sunroom", 649, 281, 1340, 672],
  ["Porch", 753, 1282, 1228, 1413],
];
const roomRow = (name, w, d) => tr(name, `${fmt(w)} × ${fmt(d)} m &nbsp; ${fmt(w * d)} m²`);
const schedule = { before: {}, after: {} };
{
  let total = 0;
  const list = roomRects.map(([name, x0, y0, x1, y1, note]) => {
    const w = M(x1 - x0), d = M(y1 - y0);
    if (name !== "Porch") total += w * d;
    return roomRow(name, w, d) + (note ? tr(note, "", "sub") : "");
  });
  list.push(tr("Carport (double)", "5.7 × 5.7 m &nbsp; 31.3 m²"));
  list.push(tr("Shed", "3.0 × 3.0 m &nbsp; 9.0 m²"));
  list.push(tr("Internal rooms total", `${fmt(total)} m²`, "total"));
  schedule.before.rooms = list;

  const houseW = M(1913 - 446), houseD = M(1366 - 672);
  schedule.before.property = [
    tr("House footprint", `${fmt(houseW)} × ${fmt(houseD)} m`),
    tr("Living area", "153.9 m²"),
    tr("Bed / bath / car", "4 / 1 / 2"),
    tr("Front setback", `${fmt(LOT_D - HOUSE_SOUTH)} m`),
    tr("Rear yard", `${fmt(Z(672))} m (${fmt(Z(277))} to sunroom)`),
    tr("Side setbacks", `W ${fmt(X(446))} m, E ${fmt(LOT_W - X(1913))} m`),
  ];
}
{
  let total = 0;
  const list = proposedRooms.map(([name, x0, z0, x1, z1]) => {
    total += (x1 - x0) * (z1 - z0);
    return roomRow(name, x1 - x0, z1 - z0);
  });
  list.push(roomRow("Covered deck", 5.0, 4.0));
  list.push(roomRow("Carport (open)", 5.8, 6.0));
  list.push(roomRow("Shed", 3.0, 3.0));
  list.push(tr("Internal rooms total", `${fmt(total)} m²`, "total"));
  schedule.after.rooms = list;
  schedule.after.property = [
    tr("House footprint", "16.9 × 7.4 m + suite 6.0 × 4.4 m"),
    tr("Under roof", `${fmt(16.9 * 7.42 + 6 * 4.4)} m²`),
    tr("Bed / bath / car", "5 / 2 + WC / 2"),
    tr("Front setback", `${fmt(LOT_D - HOUSE_SOUTH)} m`),
    tr("Rear yard", "14.2 m (9.8 to suite)"),
    tr("Side setbacks", "W 1.5 m, E 1.6 m"),
  ];
}
const propertyCommon = [
  tr("Land", "587 m² &nbsp; 20 × 29 m"),
  tr("Lot", "156 RP123045"),
  tr("Council", "Toowoomba Regional"),
];
const propertyMarket = [
  tr("Ceiling height", `${fmt(CEIL)} m`),
  tr("Last sold", "$630,000 (Jan 2025)"),
  tr("Value estimate", "$730k – $870k"),
  tr("Rent estimate", "$645 / week"),
];

function renderReno() {
  if (!renoItems.length) {
    rows("reno-table", [`<tr><td class="note">Costing to follow once the design is approved.</td></tr>`]);
    return;
  }
  let sub = 0;
  const list = renoItems.map(({ item, qty, unit, rate }) => {
    const cost = qty * rate;
    sub += cost;
    return tr(item, money(cost)) + tr(`${qty} ${unit} × ${money(rate)}`, "", "sub");
  });
  list.push(tr("Subtotal", money(sub), "total"));
  list.push(tr("Contingency 10%", money(sub * 0.1)));
  list.push(tr("Total", money(sub * 1.1), "total"));
  rows("reno-table", list);
}

function setPhase(phase) {
  const isAfter = phase === "after";
  for (const g of Object.values(before)) g.visible = !isAfter;
  for (const g of Object.values(after)) g.visible = isAfter;
  const s = schedule[phase];
  rows("room-table", s.rooms);
  rows("property-table", [...propertyCommon, ...s.property, ...propertyMarket]);
  document.getElementById("room-note").textContent = isAfter
    ? "Proposed design, internal sizes. Full plan: renovation/plan.html."
    : "Internal sizes measured off the 2025 floor plan (wall to wall).";
  document.getElementById("reno").hidden = !isAfter;
  document.getElementById("phase-before").classList.toggle("active", !isAfter);
  document.getElementById("phase-after").classList.toggle("active", isAfter);
  if (isAfter) renderReno();
}
document.getElementById("phase-before").onclick = () => setPhase("before");
document.getElementById("phase-after").onclick = () => setPhase("after");
setPhase("before");

// ---------- UI ----------
const views = {
  front: { pos: [6, 8, 47], target: [10, 1.4, 20] },
  rear: { pos: [14, 11, -12], target: [10, 1.2, 14] },
  top: { pos: [10, 42, 16.6], target: [10, 0, 16] },
};
function setView(name) {
  const target = new THREE.Vector3(...views[name].target);
  const offset = new THREE.Vector3(...views[name].pos).sub(target);
  offset.multiplyScalar(Math.max(1, 1.5 / camera.aspect));
  camera.position.copy(target).add(offset);
  controls.target.copy(target);
  controls.update();
  for (const k of Object.keys(views)) document.getElementById("cam-" + k).classList.toggle("active", k === name);
}
for (const k of Object.keys(views)) document.getElementById("cam-" + k).onclick = () => setView(k);

function toggle(id, group, on, off) {
  const btn = document.getElementById(id);
  btn.onclick = () => {
    group.visible = !group.visible;
    btn.textContent = group.visible ? on : off;
    btn.classList.toggle("active", group.visible);
  };
}
const toggleMenu = () => document.body.classList.toggle("menu-hidden");
document.getElementById("menu-hide").onclick = toggleMenu;
document.getElementById("menu-show").onclick = toggleMenu;
addEventListener("keydown", (e) => { if (e.key.toLowerCase() === "m" && !e.metaKey && !e.ctrlKey) toggleMenu(); });
toggle("toggle-roof", roofs, "Roof on", "Roof off");
toggle("toggle-labels", labels, "Labels on", "Labels off");

setView("front");
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});
  </script>
</body>
